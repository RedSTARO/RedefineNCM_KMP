<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101116">
    <title>RedefineNCM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="redefineNcmBoot" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <span id="redefineNcmBootLabel"></span>
        <div id="redefineNcmBootProgress" class="boot-progress" hidden>
            <progress id="redefineNcmBootBar" max="1"></progress>
            <span id="redefineNcmBootBytes" aria-hidden="true"></span>
        </div>
    </div>
    <div id="redefineNcmApp"></div>
    <script>
        // This page runs before the app's own copy (src/commonMain/i18n) has loaded, so it keeps
        // its few strings here in the same three languages. It picks one the way the app does:
        // the stored choice, else the first of the browser's languages it has, else English.
        const bootText = (() => {
            const table = {
                zh: {
                    loading: "正在加载 Web 应用…",
                    progress: "字体下载进度",
                    fontFailed: "字体加载失败：HTTP ",
                    firstRun: "首次打开需要下载中文字体",
                    starting: "正在启动…",
                },
                en: {
                    loading: "Loading the web app…",
                    progress: "Font download progress",
                    fontFailed: "Couldn't load the font: HTTP ",
                    firstRun: "Downloading the Chinese font for the first launch",
                    starting: "Starting…",
                },
                ja: {
                    loading: "Webアプリを読み込んでいます…",
                    progress: "フォントのダウンロード状況",
                    fontFailed: "フォントを読み込めません：HTTP ",
                    firstRun: "初回のみ中国語フォントをダウンロードします",
                    starting: "起動しています…",
                },
            };
            const known = tag => {
                const code = String(tag || "").split(/[-_]/)[0].toLowerCase();
                return code in table ? code : null;
            };
            let stored = null;
            try {
                stored = localStorage.getItem("appLanguage");
            } catch (_) {
                // Storage can be blocked; follow the browser then.
            }
            let language = stored && stored !== "system" ? known(stored) : null;
            if (!language) {
                const browser = navigator.languages && navigator.languages.length
                    ? navigator.languages
                    : [navigator.language];
                language = browser.map(known).find(Boolean) || "en";
            }
            document.documentElement.lang = { zh: "zh-CN", en: "en", ja: "ja" }[language];
            return table[language];
        })();
        document.getElementById("redefineNcmBootLabel").textContent = bootText.loading;
        document.getElementById("redefineNcmBootBar").setAttribute("aria-label", bootText.progress);

        globalThis.__redefineNcmFontReady = (async () => {
            const response = await fetch(
                "composeResources/redefinencm_kmp.shared.generated.resources/font/noto_sans_sc_variable.ttf",
                { cache: "force-cache" }
            );
            if (!response.ok) throw new Error(bootText.fontFailed + response.status);
            // Read the body through so the browser cache is warm, without keeping the 17 MB of it
            // as the resolved value of the page-lifetime readiness promise.
            const reader = response.body?.getReader();
            if (!reader) {
                await response.arrayBuffer();
                return;
            }
            // Content-Length counts the bytes on the wire; a compressed response decodes to more
            // than that, so the total is only shown when nothing was compressed.
            const total = response.headers.get("Content-Encoding")
                ? 0
                : Number(response.headers.get("Content-Length")) || 0;
            const label = document.getElementById("redefineNcmBootLabel");
            const progress = document.getElementById("redefineNcmBootProgress");
            const bar = document.getElementById("redefineNcmBootBar");
            const bytes = document.getElementById("redefineNcmBootBytes");
            const megabytes = count => (count / 1e6).toFixed(1);
            // A cached font reads through in a moment; only a real download shows the progress,
            // so a returning visit does not flash it.
            const reveal = setTimeout(() => {
                label.textContent = bootText.firstRun;
                progress.hidden = false;
            }, 400);
            let loaded = 0;
            try {
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    loaded += value.byteLength;
                    if (total > 0) bar.value = Math.min(loaded / total, 1);
                    bytes.textContent = total > 0
                        ? megabytes(loaded) + " / " + megabytes(total) + " MB"
                        : megabytes(loaded) + " MB";
                }
            } finally {
                clearTimeout(reveal);
                progress.hidden = true;
                label.textContent = bootText.starting;
            }
        })();
    </script>
    <script src="redefinencm.js"></script>
</body>
</html>
