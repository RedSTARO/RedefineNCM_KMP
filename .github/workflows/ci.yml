name: KMP CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ─── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests and compile checks
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.app_version.outputs.app_version }}
      base_tag: ${{ steps.app_version.outputs.base_tag }}
      commit_hash: ${{ steps.app_version.outputs.commit_hash }}
      version_code: ${{ steps.app_version.outputs.version_code }}
      native_package_version: ${{ steps.app_version.outputs.native_package_version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --force --tags

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          # Robolectric's Android 16 runtime requires Java 21.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Resolve canonical app version
        id: app_version
        run: |
          chmod +x gradlew
          set -euo pipefail
          version_output="$(./gradlew --quiet printAppVersion)"
          read_version() {
            printf '%s\n' "$version_output" | sed -n "s/^$1=//p" | tail -n1
          }

          APP_VERSION="$(read_version versionName)"
          BASE_TAG="$(read_version baseTag)"
          COMMIT_HASH="$(read_version commitHash)"
          VERSION_CODE="$(read_version versionCode)"
          NATIVE_PACKAGE_VERSION="$(read_version nativePackageVersion)"
          test -n "$APP_VERSION"
          test -n "$BASE_TAG"
          test -n "$COMMIT_HASH"
          test -n "$VERSION_CODE"
          test -n "$NATIVE_PACKAGE_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$BASE_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag build '$GITHUB_REF_NAME' resolved mismatched base tag '$BASE_TAG'." >&2
            exit 1
          fi

          {
            echo "app_version=$APP_VERSION"
            echo "base_tag=$BASE_TAG"
            echo "commit_hash=$COMMIT_HASH"
            echo "version_code=$VERSION_CODE"
            echo "native_package_version=$NATIVE_PACKAGE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Reject runtime dumps and JWT credentials
        run: |
          python scripts/check_tracked_secrets.py --self-test

      - name: Verify packaged third-party notices
        run: |
          for license in \
            AGPL-3.0-only.txt \
            Apache-2.0.txt \
            Bytedeco-1.5.13-LICENSE.txt \
            FFmpeg-8.0.1-LICENSE.md \
            GNU-Library-GPL-2.0-or-later.txt \
            GPL-3.0.txt \
            LGPL-2.1.txt \
            LGPL-3.0-or-later.txt
          do
            test -s "LICENSES/$license"
          done
          # The project's own license is the same AGPL text the notices point to.
          cmp LICENSE LICENSES/AGPL-3.0-only.txt
          cmp LICENSES/AGPL-3.0-only.txt \
            shared/src/commonMain/composeResources/files/licenses/AGPL-3.0-only.txt
          cmp LICENSES/Apache-2.0.txt \
            shared/src/commonMain/composeResources/files/licenses/Apache-2.0.txt
          cmp THIRD_PARTY_NOTICES.md \
            shared/src/commonMain/composeResources/files/licenses/THIRD_PARTY_NOTICES.md

      - name: Run native AMLL parser tests and compile checks
        run: |
          chmod +x gradlew
          # The JVM suite covers the app's lyric pipeline and a real Linux MPRIS client/server
          # smoke test. The lyric parsers and the AMLL engine live in the included build, whose
          # own suite :shared:jvmTest only compiles against; it runs here by its build path.
          dbus-run-session -- ./gradlew --no-daemon :shared:jvmTest
          ./gradlew :AMLL_Jetpack_Compose:amll-compose:jvmTest
          # :desktopApp:test covers the instance lock, the log file and the start-up checks.
          ./gradlew \
            :shared:testAndroidHostTest \
            :desktopApp:test \
            :desktopApp:prepareDesktopLegalResources
          diff --recursive --brief \
            LICENSES \
            desktopApp/build/generated/desktopLegalResources/common/LICENSES
          cmp THIRD_PARTY_NOTICES.md \
            desktopApp/build/generated/desktopLegalResources/common/THIRD_PARTY_NOTICES.md

  # ─── Android ────────────────────────────────────────────────────────────────
  build-android:
    name: Android (per-ABI APKs)
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
      REDEFINE_NCM_BASE_TAG: ${{ needs.test.outputs.base_tag }}
      REDEFINE_NCM_COMMIT_HASH: ${{ needs.test.outputs.commit_hash }}
      REDEFINE_NCM_VERSION_CODE: ${{ needs.test.outputs.version_code }}
      REDEFINE_NCM_VERSION_NAME: ${{ needs.test.outputs.app_version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build and verify per-ABI release APKs
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease
          metadata=androidApp/build/outputs/apk/release/output-metadata.json
          jq -e \
            --arg version "$APP_VERSION" \
            --argjson code "$REDEFINE_NCM_VERSION_CODE" \
            '(.elements | length == 4) and
             all(.elements[]; .versionName == $version and .versionCode == $code) and
             ([.elements[].filters | select(length == 1) | .[0] |
               select(.filterType == "ABI") | .value] | sort) ==
               ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]' \
            "$metadata"
          # The release variant must have gone through R8 and resource shrinking. A fresh CI
          # checkout cannot have stale outputs, so these files prove this build produced the
          # optimized artifact that Telegram and the GitHub Release are allowed to publish.
          test -s androidApp/build/outputs/mapping/release/mapping.txt
          test -s androidApp/build/outputs/mapping/release/resources.txt
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            output_file=$(jq -er --arg abi "$abi" \
              '.elements[] | select(any(.filters[]; .filterType == "ABI" and .value == $abi)) |
               .outputFile' "$metadata")
            source_apk="androidApp/build/outputs/apk/release/$output_file"
            test -f "$source_apk"
            # Inspect the actual ZIP contents as well as AGP's metadata: a renamed
            # universal APK must never pass as a smaller single-architecture package.
            actual_abis=$(unzip -Z1 "$source_apk" | sed -n 's|^lib/\([^/]*\)/.*\.so$|\1|p' | sort -u)
            test "$actual_abis" = "$abi"
            cp "$source_apk" \
              "androidApp/build/outputs/apk/release/RedefineNCM_KMP-${APP_VERSION}-${abi}-release-unsigned.apk"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk-release-minified
          path: androidApp/build/outputs/apk/release/RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-*-release-unsigned.apk
          if-no-files-found: error

      # R8 renames the app's symbols; a stack trace from this build needs this build's map.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbol-map-android
          path: androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  # ─── Web · Wasm ────────────────────────────────────────────────────────────
  build-web:
    name: Web · Wasm (tests + production bundle)
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
      REDEFINE_NCM_BASE_TAG: ${{ needs.test.outputs.base_tag }}
      REDEFINE_NCM_COMMIT_HASH: ${{ needs.test.outputs.commit_hash }}
      REDEFINE_NCM_VERSION_CODE: ${{ needs.test.outputs.version_code }}
      REDEFINE_NCM_VERSION_NAME: ${{ needs.test.outputs.app_version }}
      NATIVE_PACKAGE_VERSION: ${{ needs.test.outputs.native_package_version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Test and build production distribution
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :shared:wasmJsBrowserTest \
            :shared:wasmJsBrowserDistribution

      - name: Package Web distribution
        run: |
          jq -e \
            --arg version "$APP_VERSION" \
            --arg tag "$REDEFINE_NCM_BASE_TAG" \
            --arg hash "$REDEFINE_NCM_COMMIT_HASH" \
            --argjson build "$REDEFINE_NCM_VERSION_CODE" \
            --arg native "$NATIVE_PACKAGE_VERSION" \
            '.version == $version and .tag == $tag and .hash == $hash and
              .build == $build and .nativePackageVersion == $native' \
            shared/build/dist/wasmJs/productionExecutable/version.json
          mkdir -p shared/build/distributions
          (
            cd shared/build/dist/wasmJs/productionExecutable
            zip -qr "../../../distributions/RedefineNCM_KMP-${APP_VERSION}-web.zip" .
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-wasm-distribution
          path: shared/build/distributions/RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-web.zip
          if-no-files-found: error

  # Main and tag pushes publish installable signed R8-minified APKs for every ABI; other branches
  # and pull requests only verify the unsigned optimized release output.
  sign-android:
    name: Sign Android release (${{ matrix.abi }})
    needs: [ test, build-android ]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a, x86, x86_64 ]
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
      APK_ABI: ${{ matrix.abi }}

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk-release-minified
          path: unsigned-apk

      - name: Prepare release APK for signing
        run: |
          source_apk="unsigned-apk/RedefineNCM_KMP-${APP_VERSION}-${APK_ABI}-release-unsigned.apk"
          test -f "$source_apk"
          mkdir -p androidApp/build/outputs/apk/release
          cp "$source_apk" \
            "androidApp/build/outputs/apk/release/RedefineNCM_KMP-${APP_VERSION}-${APK_ABI}-release-unsigned.apk"

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename signed APK
        env:
          SIGNED_APK: ${{ steps.sign_app.outputs.signedReleaseFile }}
        run: |
          mv "$SIGNED_APK" \
            "androidApp/build/outputs/apk/release/RedefineNCM_KMP-${APP_VERSION}-${APK_ABI}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk-release-minified-signed-${{ matrix.abi }}
          path: androidApp/build/outputs/apk/release/RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-${{ matrix.abi }}.apk
          if-no-files-found: error

  # ─── Desktop · Linux ────────────────────────────────────────────────────────
  build-desktop-linux:
    name: Desktop · Linux (.deb)
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
      REDEFINE_NCM_BASE_TAG: ${{ needs.test.outputs.base_tag }}
      REDEFINE_NCM_COMMIT_HASH: ${{ needs.test.outputs.commit_hash }}
      REDEFINE_NCM_VERSION_CODE: ${{ needs.test.outputs.version_code }}
      REDEFINE_NCM_VERSION_NAME: ${{ needs.test.outputs.app_version }}
      NATIVE_PACKAGE_VERSION: ${{ needs.test.outputs.native_package_version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        id: jdk
        with:
          # Also the runtime the package bundles: see DESKTOP_RUNTIME_JAVA_HOME below.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build .deb package
        env:
          DESKTOP_RUNTIME_JAVA_HOME: ${{ steps.jdk.outputs.path }}
          DESKTOP_RUNTIME_JAVA_VERSION: ${{ steps.jdk.outputs.version }}
        run: |
          chmod +x gradlew
          # packageReleaseDeb is the ProGuard-shrunk/optimized/obfuscated distribution — the
          # Desktop counterpart of the Android R8 release pipeline. Never plain packageDeb.
          ./gradlew :desktopApp:packageReleaseDeb
          package=$(find desktopApp/build/compose/binaries/main-release/deb -name '*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Version)" = "$NATIVE_PACKAGE_VERSION"
          # jpackage registers an application-menu entry only when asked for a shortcut. The
          # listing goes to a file first: grep -q exits at the match, and with the pipe the
          # still-writing tar dies of SIGPIPE and dpkg-deb reports it as a failed extraction.
          dpkg-deb -c "$package" > "$RUNNER_TEMP/deb-contents.txt"
          grep -q '\.desktop$' "$RUNNER_TEMP/deb-contents.txt"
          # The deb is built straight from the jlink runtime image createRuntimeImage makes — only
          # packageReleaseDmg also builds an app image under binaries/main-release/app, so that is
          # not where to look here. This image is what jpackage copies into the package.
          runtime=desktopApp/build/compose/tmp/main/runtime/release
          bash scripts/check_packaged_runtime.sh "$runtime" "$DESKTOP_RUNTIME_JAVA_VERSION"
          mv "$package" "$(dirname "$package")/RedefineNCM_KMP-${APP_VERSION}-linux-amd64.deb"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbol-map-desktop-linux
          path: desktopApp/build/proguard/mapping.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux-deb
          path: desktopApp/build/compose/binaries/main-release/deb/RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-linux-amd64.deb
          if-no-files-found: error

  # ─── Desktop · Windows ──────────────────────────────────────────────────────
  build-desktop-windows:
    name: Desktop · Windows (.msi)
    needs: test
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
      REDEFINE_NCM_BASE_TAG: ${{ needs.test.outputs.base_tag }}
      REDEFINE_NCM_COMMIT_HASH: ${{ needs.test.outputs.commit_hash }}
      REDEFINE_NCM_VERSION_CODE: ${{ needs.test.outputs.version_code }}
      REDEFINE_NCM_VERSION_NAME: ${{ needs.test.outputs.app_version }}
      NATIVE_PACKAGE_VERSION: ${{ needs.test.outputs.native_package_version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        id: jdk
        with:
          # Also the runtime the package bundles: see DESKTOP_RUNTIME_JAVA_HOME below.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build .msi installer
        env:
          DESKTOP_RUNTIME_JAVA_HOME: ${{ steps.jdk.outputs.path }}
          DESKTOP_RUNTIME_JAVA_VERSION: ${{ steps.jdk.outputs.version }}
        run: |
          ./gradlew :shared:jvmTest :desktopApp:test :desktopApp:packageReleaseMsi
          # The daemon holds lock files under ~/.gradle/caches, and the post-job cache save
          # then fails to archive them, so this job never kept its cache.
          ./gradlew --stop
          # The .msi is built straight from the jlink runtime image createRuntimeImage makes — only
          # packageReleaseDmg also builds an app image under binaries/main-release/app, so that is
          # not where to look here. This image is what jpackage copies into the package.
          bash scripts/check_packaged_runtime.sh desktopApp/build/compose/tmp/main/runtime/release "$env:DESKTOP_RUNTIME_JAVA_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "The packaged runtime is not the one set up for this job." }
          $package = Get-ChildItem -Path desktopApp/build/compose/binaries/main-release/msi -Filter *.msi | Select-Object -First 1
          if (-not $package) { throw "MSI package was not produced." }
          $installer = $null
          $database = $null
          $view = $null
          $record = $null
          try {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $database = $installer.OpenDatabase($package.FullName, 0)
            $view = $database.OpenView("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
            $view.Execute()
            $record = $view.Fetch()
            if ($null -eq $record) { throw "MSI ProductVersion is missing." }
            $actualVersion = $record.StringData(1)
          } finally {
            if ($null -ne $view) { $view.Close() }
            foreach ($comObject in @($record, $view, $database, $installer)) {
              if ($null -ne $comObject) {
                [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($comObject)
              }
            }
            [GC]::Collect()
            [GC]::WaitForPendingFinalizers()
          }
          if ($actualVersion -ne $env:NATIVE_PACKAGE_VERSION) {
            throw "MSI ProductVersion '$actualVersion' does not match '$env:NATIVE_PACKAGE_VERSION'."
          }
          $target = Join-Path $package.DirectoryName "RedefineNCM_KMP-$env:APP_VERSION-windows-x64.msi"
          Move-Item -LiteralPath $package.FullName -Destination $target

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbol-map-desktop-windows
          path: desktopApp/build/proguard/mapping.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-msi
          path: desktopApp/build/compose/binaries/main-release/msi/RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-windows-x64.msi
          if-no-files-found: error

  # ─── Desktop · macOS ────────────────────────────────────────────────────────
  build-desktop-macos:
    name: Desktop · macOS ${{ matrix.arch }} (.dmg)
    needs: test
    # Each package bundles its host's runtime, Skiko and FFmpeg natives, so an Intel Mac needs a
    # package built on an Intel runner (decided 2026-10-21).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
      REDEFINE_NCM_BASE_TAG: ${{ needs.test.outputs.base_tag }}
      REDEFINE_NCM_COMMIT_HASH: ${{ needs.test.outputs.commit_hash }}
      REDEFINE_NCM_VERSION_CODE: ${{ needs.test.outputs.version_code }}
      REDEFINE_NCM_VERSION_NAME: ${{ needs.test.outputs.app_version }}
      NATIVE_PACKAGE_VERSION: ${{ needs.test.outputs.native_package_version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        id: jdk
        with:
          # Also the runtime the package bundles: see DESKTOP_RUNTIME_JAVA_HOME below.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build .dmg image
        env:
          DESKTOP_RUNTIME_JAVA_HOME: ${{ steps.jdk.outputs.path }}
          DESKTOP_RUNTIME_JAVA_VERSION: ${{ steps.jdk.outputs.version }}
          MAC_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          # jvmTest executes the native MPNowPlayingInfoCenter/remote-command smoke on macOS.
          # packageReleaseDmg runs the same ProGuard release pipeline as the .msi and .deb.
          ./gradlew :shared:jvmTest :desktopApp:test :desktopApp:packageReleaseDmg
          plist=$(find desktopApp/build/compose/binaries/main-release -path '*/RedefineNCM.app/Contents/Info.plist' -print -quit)
          test -n "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$NATIVE_PACKAGE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$NATIVE_PACKAGE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :RedefineNCMVersionName' "$plist")" = "$APP_VERSION"
          runtime=$(find desktopApp/build/compose/binaries/main-release/app -path '*/RedefineNCM.app/Contents/runtime/Contents/Home/release' -print -quit)
          bash scripts/check_packaged_runtime.sh "$runtime" "$DESKTOP_RUNTIME_JAVA_VERSION"
          package=$(find desktopApp/build/compose/binaries/main-release/dmg -name '*.dmg' -print -quit)
          test -n "$package"
          mv "$package" "$(dirname "$package")/RedefineNCM_KMP-${APP_VERSION}-macos-${MAC_ARCH}.dmg"

      - name: Upload jpackage diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-${{ matrix.arch }}-jpackage-logs
          path: desktopApp/build/compose/logs/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbol-map-desktop-macos-${{ matrix.arch }}
          path: desktopApp/build/proguard/mapping.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-${{ matrix.arch }}-dmg
          path: desktopApp/build/compose/binaries/main-release/dmg/RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ─── iOS ────────────────────────────────────────────────────────────────────
  build-ios:
    name: iOS (framework + app)
    needs: test
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
      REDEFINE_NCM_BASE_TAG: ${{ needs.test.outputs.base_tag }}
      REDEFINE_NCM_COMMIT_HASH: ${{ needs.test.outputs.commit_hash }}
      REDEFINE_NCM_VERSION_CODE: ${{ needs.test.outputs.version_code }}
      REDEFINE_NCM_VERSION_NAME: ${{ needs.test.outputs.app_version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compile iOS release frameworks
        # Release frameworks are the Kotlin/Native optimized binaries (LLVM -O plus
        # whole-program dead-code elimination) — the iOS counterpart of the Android R8
        # release pipeline. Both declared Apple targets are linked so the device slice
        # is covered, not just the simulator. Full IPA signing requires Xcode
        # provisioning and is not done in CI.
        #
        # One Gradle invocation per link, deliberately. Asking for all three in a single
        # invocation lets Gradle schedule them concurrently inside one Kotlin daemon, and each
        # Kotlin/Native link needs several GB of heap on its own, so they exhaust
        # kotlin.daemon.jvmargs together and die with "Compilation failed: Java heap space".
        # Serially each one fits comfortably. Do not re-merge these lines.
        run: |
          ./gradlew :shared:iosSimulatorArm64Test
          ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64
          ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Compile iOS app and Live Activity widget
        # Release drives Swift whole-module optimization and makes the Gradle build
        # phase embed the release (optimized) Shared.framework, not the debug one.
        # stamp-version.sh must run first: it writes Configuration/Version.xcconfig, and
        # xcconfig files are read when xcodebuild starts, not during the build phases.
        run: |
          sh iosApp/Scripts/stamp-version.sh
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify iOS product versions
        run: |
          app_plist="iosApp/build/DerivedData/Build/Products/Release-iphonesimulator/RedefineNCM_KMP.app/Info.plist"
          widget_plist="iosApp/build/DerivedData/Build/Products/Release-iphonesimulator/RedefineNCM_KMP.app/PlugIns/LyricWidget.appex/Info.plist"
          for plist in "$app_plist" "$widget_plist"; do
            test -f "$plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${REDEFINE_NCM_BASE_TAG#v}"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$REDEFINE_NCM_VERSION_CODE"
            test "$(/usr/libexec/PlistBuddy -c 'Print :RedefineNCMVersionName' "$plist")" = "$APP_VERSION"
          done

  # ─── Telegram 通知（所有构建完成后汇总推送）────────────────────────────────────
  notify-telegram:
    name: Notify Telegram
    needs: [ test, build-android, sign-android, build-web, build-desktop-linux, build-desktop-windows, build-desktop-macos, build-ios ]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Count commits since last tag
        id: commitcount
        run: |
          git fetch --force --tags
          latest_tag=$(git tag --sort=-creatordate | head -n1)
          if [ -z "$latest_tag" ]; then
            count=$(git rev-list --count HEAD)
          else
            count=$(git rev-list --count "${latest_tag}..HEAD")
          fi
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Get commit info
        id: gitinfo
        run: |
          echo "commit_msg=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download signed R8-minified ARM64 APK
        # A pattern that matches nothing is not an error, unlike a name: a failed build still
        # gets its message, without the APK.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: android-apk-release-minified-signed-arm64-v8a
          path: dist/android
          merge-multiple: true

      - name: Send artifacts to Telegram
        # Everything that comes from the commit or the ref reaches the script as an environment
        # variable. Written into the script text with ${{ }}, a commit subject holding a
        # backtick, a quote or $( ) would be run by the shell, next to the bot token.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAW_MSG: ${{ steps.gitinfo.outputs.commit_msg }}
          SHA: ${{ steps.gitinfo.outputs.commit_sha }}
          COUNT: ${{ steps.commitcount.outputs.count }}
          REF: ${{ github.ref_name }}
          VERSION: ${{ needs.test.outputs.app_version }}
          # Each row is its job's own result, so a failure is reported, not inferred from a file.
          TEST_RESULT: ${{ needs.test.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          SIGN_RESULT: ${{ needs.sign-android.result }}
          LINUX_RESULT: ${{ needs.build-desktop-linux.result }}
          WINDOWS_RESULT: ${{ needs.build-desktop-windows.result }}
          MACOS_RESULT: ${{ needs.build-desktop-macos.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          WEB_RESULT: ${{ needs.build-web.result }}
        run: |
          APK=$(find dist/android -name "RedefineNCM_KMP-${VERSION}-arm64-v8a.apk" 2>/dev/null | head -1)

          # ✅ success, ⏭️ skipped (an earlier job failed), ❌ failed or cancelled.
          status() {
            case "$1" in
              success) printf '✅' ;;
              skipped) printf '⏭️' ;;
              *) printf '❌' ;;
            esac
          }

          MSG=$(printf '%s' "$RAW_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION=$(printf '<b>RedefineNCM KMP</b>  ·  <code>%s</code>\n\n📝 %s\n🔖 <code>%s</code>  ·  <code>%s</code>  ·  +%s commits\n\n──────────────────\n🧪 Tests    %s\n🤖 Android  %s  build  %s  signed APKs (4 ABIs)\n🐧 Linux    %s  .deb (amd64)\n🪟 Windows  %s  .msi (x64)\n🍎 macOS    %s  .dmg (arm64 + x64)\n📱 iOS      %s  framework + app\n🌐 Web      %s  .zip\n\n<i>其他 Android 架构、桌面端与 Web 产物见 CI artifacts。</i>' \
            "$REF" "$MSG" "$VERSION" "$SHA" "$COUNT" \
            "$(status "$TEST_RESULT")" "$(status "$ANDROID_RESULT")" "$(status "$SIGN_RESULT")" \
            "$(status "$LINUX_RESULT")" "$(status "$WINDOWS_RESULT")" "$(status "$MACOS_RESULT")" \
            "$(status "$IOS_RESULT")" "$(status "$WEB_RESULT")")

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          if [ -n "$APK" ] && [ -f "$APK" ]; then
            # Desktop packages bundle the JVM and exceed Telegram's 50 MB bot-API limit;
            # only the APK is uploaded. Desktop build status is shown in the caption text.
            CAPTION_FILE=$(mktemp)
            printf '%s' "$CAPTION" > "$CAPTION_FILE"
            curl -sS -X POST "${API}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK}" \
              -F "caption=<${CAPTION_FILE}" \
              -F parse_mode=HTML
            rm -f "$CAPTION_FILE"
          else
            # No APK — text-only status message
            curl -sS -X POST "${API}/sendMessage" \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg c "$TELEGRAM_CHAT_ID" --arg t "$CAPTION" \
                '{"chat_id":$c,"text":$t,"parse_mode":"HTML"}')"
          fi

  # ─── GitHub Release (tag only) ──────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [ test, sign-android, build-web, build-desktop-linux, build-desktop-windows, build-desktop-macos, build-ios ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build changelog since last tag
        id: changelog
        run: |
          git fetch --force --tags
          current="$GITHUB_REF_NAME"
          previous=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 "${current}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            log=$(git log --oneline "$current")
            count=$(git rev-list --count "$current")
          else
            log=$(git log --oneline "${previous}..${current}")
            count=$(git rev-list --count "${previous}..${current}")
          fi
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$log" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Download release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Symbol maps all contain mapping.txt; keep them as separate CI artifacts.
          # Verification APKs and packaging logs are not release packages either.
          pattern: '{android-apk-release-minified-signed-*,web-wasm-distribution,desktop-linux-deb,desktop-windows-msi,desktop-macos-*-dmg}'
          path: dist/
          merge-multiple: true

      - name: Download symbol maps
        # Every map is called mapping.txt, so each goes to its own directory. They are kept with
        # the release: as workflow artifacts they expired after 90 days while the obfuscated
        # packages stayed downloadable, and a stack trace from those could no longer be read.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: symbol-map-*
          path: symbol-maps/

      - name: Name symbol maps for the release
        env:
          VERSION: ${{ needs.test.outputs.app_version }}
        run: |
          set -euo pipefail
          count=0
          for map in symbol-maps/*/mapping.txt; do
            platform=$(basename "$(dirname "$map")")
            platform=${platform#symbol-map-}
            cp "$map" "dist/RedefineNCM_KMP-${VERSION}-${platform}-mapping.txt"
            count=$((count + 1))
          done
          test "$count" -gt 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ needs.test.outputs.app_version }}"
          files: dist/**/*
          body: |
            🎉 **RedefineNCM KMP ${{ needs.test.outputs.app_version }}**

            📦 **${{ steps.changelog.outputs.count }} commits since last release**
            ```
            ${{ steps.changelog.outputs.log }}
            ```

            | Platform | File |
            |----------|------|
            | Android ARM64 | `RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-arm64-v8a.apk` (signed, R8-minified) |
            | Android ARM32 | `RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-armeabi-v7a.apk` (signed, R8-minified) |
            | Android x86 | `RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-x86.apk` (signed, R8-minified) |
            | Android x86_64 | `RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-x86_64.apk` (signed, R8-minified) |
            | Linux (x86_64 / amd64) | `RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-linux-amd64.deb` |
            | Windows (x64) | `RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-windows-x64.msi` |
            | macOS (Apple silicon) | `RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-macos-arm64.dmg` |
            | macOS (Intel) | `RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-macos-x64.dmg` |
            | Web | `RedefineNCM_KMP-${{ needs.test.outputs.app_version }}-web.zip` |

            The desktop packages are not signed or notarized. macOS: open the app once, then
            System Settings → Privacy & Security → Open Anyway. Windows: on the SmartScreen
            prompt choose More info → Run anyway.

            The `*-mapping.txt` files map the renamed classes in a release build's stack trace
            (from the Android app or a desktop log) back to the source.

            Licensed under AGPL-3.0-only. Complete source: [${{ github.ref_name }}](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}), with the `AMLL_Jetpack_Compose` submodule at the commit it pins.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
