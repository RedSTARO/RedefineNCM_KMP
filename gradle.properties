#Kotlin
kotlin.code.style=official
# Each Kotlin/Native release link needs more than 3 GB; at -Xmx3072M it dies with
# "Compilation failed: Java heap space". This ceiling covers one link at a time — CI runs
# the iOS links in separate Gradle invocations so they never share this heap concurrently.
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# LiteRT 2.2.0 ships its runtime (litert) and its Kotlin API (litert-api) as two AARs that both
# declare the namespace com.google.ai.edge.litert, which AGP 9 otherwise rejects at manifest
# merge. Every module of this project keeps a namespace of its own.
android.uniquePackageNames=false
